<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>¡Crea tus tenis!</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fdf6fb;
        --bg2: #f3ebfa;
        --fg: #4a3f66;
        --card: #ffffff;
        --mut: #9a8fb5;
        --line: #efe4f6;
        --acc: #ff9ec4;
        --acc2: #b9a2ff;
        --sh: 0 12px 34px rgba(170, 140, 210, 0.18);
        --font: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .nodark-unused {
        --bg: #241f33;
        --bg2: #2d2740;
        --fg: #f6eefc;
        --card: #322b47;
        --mut: #bba9d8;
        --line: #443a60;
        --sh: 0 12px 34px rgba(0, 0, 0, 0.4);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(900px 520px at 5% -8%, rgba(255, 120, 180, 0.28), transparent),
          radial-gradient(900px 520px at 105% 0%, rgba(90, 140, 255, 0.25), transparent), var(--bg);
        color: var(--fg);
        font-family: var(--font);
        min-height: 100vh;
      }
      .app {
        max-width: 600px;
        margin: 0 auto;
        padding: 18px 16px 28px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 2px 14px;
      }
      h1 {
        font-size: 1.55rem;
        line-height: 1.1;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h1 span {
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      header p {
        margin: 5px 0 0;
        color: var(--mut);
        font-size: 0.82rem;
        font-weight: 500;
      }
      .stage {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        background: #dcdcdc;
        box-shadow: var(--sh);
        line-height: 0;
        animation: in 0.7s ease both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.985);
        }
      }
      .stage canvas {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
        touch-action: manipulation;
      }
      .stage canvas.top {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .stage:after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.22));
        border-radius: inherit;
      }
      .pin {
        position: absolute;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        border: 2px solid #fff;
        opacity: 0.75;
        background: var(--c, #fff);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        z-index: 3;
        transition: transform 0.2s;
        line-height: 0;
        padding: 0;
      }
      .pin:hover {
        transform: scale(1.15);
      }
      .pin.on {
        transform: scale(1.35);
        border-color: var(--acc);
        opacity: 1;
      }
      .pin.on:before {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        border: 2px solid var(--acc);
        animation: ring 1.6s ease-out infinite;
      }
      @keyframes ring {
        from {
          transform: scale(0.6);
          opacity: 1;
        }
        to {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      .tag {
        position: absolute;
        z-index: 4;
        pointer-events: none;
        background: var(--fg);
        color: var(--bg);
        font: 700 0.72rem/1 var(--font);
        padding: 6px 10px;
        border-radius: 99px;
        white-space: nowrap;
        transform: translate(-50%, -190%);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      .hold {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 5;
        border: 0;
        background: rgba(20, 20, 26, 0.62);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #fff;
        font: 600 0.72rem/1 var(--font);
        padding: 9px 12px;
        border-radius: 99px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 16px 2px 8px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        padding: 9px 14px 9px 10px;
        border-radius: 99px;
        font: 600 0.82rem var(--font);
        cursor: pointer;
        transition: 0.2s;
      }
      .tab i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--c);
        border: 1px solid rgba(0, 0, 0, 0.25);
        flex: none;
      }
      .tab.on i {
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
      }
      .tab.on {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px 14px 12px;
        margin-top: 6px;
        box-shadow: var(--sh);
      }
      .panel h2 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 1rem;
        margin: 0 2px 12px;
        font-weight: 800;
      }
      .panel h2 small {
        color: var(--acc);
        font-weight: 700;
        font-size: 0.8rem;
      }
      .opts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
        gap: 10px 6px;
      }
      .sw {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 0;
        background: none;
        color: var(--fg);
        cursor: pointer;
        padding: 0;
        font: inherit;
        position: relative;
      }
      .sw .c {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--c);
        border: 1px solid rgba(0, 0, 0, 0.18);
        box-shadow:
          inset 0 -6px 10px rgba(0, 0, 0, 0.14),
          inset 0 5px 8px rgba(255, 255, 255, 0.35),
          0 3px 8px rgba(0, 0, 0, 0.14);
        transition:
          transform 0.18s,
          box-shadow 0.18s;
        position: relative;
      }
      .sw:hover .c {
        transform: translateY(-2px);
      }
      .sw:active .c {
        transform: scale(0.92);
      }
      .sw.on .c {
        outline: 3px solid var(--acc);
        outline-offset: 3px;
      }
      .sw.on .c:after {
        content: "✓";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 800 1.1rem var(--font);
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .sw em {
        font: 600 0.66rem/1.15 var(--font);
        font-style: normal;
        color: var(--mut);
        text-align: center;
      }
      .sw.on em {
        color: var(--fg);
      }
      .c.g {
        background-image:
          linear-gradient(115deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%),
          radial-gradient(circle, rgba(255,255,255,.95) .6px, transparent 1.1px),
          radial-gradient(circle, var(--s) .5px, transparent 1px),
          linear-gradient(135deg, var(--c), var(--c));
        background-size:
          260% 100%,
          5px 5px,
          3.5px 3.5px,
          100% 100%;
        background-position:
          160% 0,
          0 0,
          3px 4px,
          0 0;
        background-repeat: no-repeat, repeat, repeat, no-repeat;
        animation: shim 3.2s ease-in-out infinite;
      }
      @keyframes shim {
        0% { background-position: 160% 0, 0 0, 2px 2px, 0 0; }
        55%, 100% { background-position: -60% 0, 5px 5px, 5px 5px, 0 0; }
      }
      .c.g:before, .c.g i:before { content: none; }
      .c.g:before {
        content: "✦";
        position: absolute;
        top: 6%;
        right: 12%;
        font-size: .8rem;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 6px rgba(255,255,255,.95), 0 0 2px rgba(0,0,0,.25);
        animation: twk 2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes twk {
        0%, 100% { transform: scale(.2) rotate(0); opacity: 0; }
        50% { transform: scale(1.1) rotate(40deg); opacity: 1; }
      }
      .c.rb {
        background: conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red);
      }
      .c.rb input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        border-radius: 50%;
      }
      .sum {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
      }
      .sum span {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 5px 10px 5px 6px;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--mut);
      }
      .sum span i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--c);
        border: 1px solid rgba(0, 0, 0, 0.25);
      }
      .sum b {
        color: var(--fg);
        font-weight: 700;
      }
      .acts {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .acts button,
      .acts a {
        flex: 1;
        text-align: center;
        text-decoration: none;
        padding: 13px 10px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font: 700 0.85rem var(--font);
        cursor: pointer;
        transition: 0.15s;
      }
      .acts button:active,
      .acts a:active {
        transform: scale(0.97);
      }
      .acts .p {
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        border: 0;
        color: #fff;
      }
      .acts .w {
        background: #1fa855;
        border: 0;
        color: #fff;
      }
      @media (min-width: 880px) {
        .app {
          max-width: 1060px;
          display: grid;
          grid-template-columns: 1.2fr 1fr;
          gap: 6px 28px;
          align-items: start;
        }
        header {
          grid-column: 1/-1;
        }
        .left {
          position: sticky;
          top: 16px;
        }
        .tabs {
          flex-wrap: wrap;
          overflow: visible;
          padding-top: 0;
        }
      }
      .stage {
        touch-action: manipulation;
      }
      #stk {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      .stk {
        position: absolute;
        transform: translate(-50%, -50%) rotate(-8deg);
        line-height: 1;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)
          drop-shadow(0 3px 3px rgba(0, 0, 0, 0.45));
      }
      .stk img {
        width: 100%;
        display: block;
        pointer-events: none;
      }
      .stk.sel {
        outline: 2px dashed var(--acc);
        outline-offset: 6px;
        border-radius: 12px;
      }
      .opts2 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 8px;
      }
      .sk .c {
        display: grid;
        place-items: center;
        font-size: 1.9rem;
        background: var(--bg2);
        box-shadow: none;
      }
      .sk:hover .c {
        transform: scale(1.12) rotate(-6deg);
      }
      .srow {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        justify-content: space-between;
      }
      .c.sm {
        display: grid;
        place-items: center;
        font-size: 1.3rem;
        width: 48px;
        height: 48px;
        background: var(--bg2);
        box-shadow: none;
      }
      .c.sm input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      .hint {
        margin: 10px 0 2px;
        text-align: center;
        color: var(--mut);
        font-size: 0.8rem;
      }
      .tab {
        font-size: 0.9rem;
      }
      .tab.on {
        transform: translateY(-2px) rotate(-1.5deg);
      }
      .sw.on .c {
        animation: pop 0.4s ease;
      }
      @keyframes pop {
        50% {
          transform: scale(1.18);
        }
      }
      h1 span {
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.08));
      }
      #rot {
        transition: transform 0.32s ease-in;
        transform-origin: 50% 50%;
        position: relative;
      }
      #cw {
        position: relative;
      }
      #cw.fl {
        transform: scaleX(-1);
      }
      .stage {
        perspective: 1100px;
      }
      .pin.lbl {
        width: auto;
        height: auto;
        margin: 0;
        padding: 6px 10px;
        border-radius: 99px;
        transform: translate(-50%, -50%);
        font: 700 0.68rem/1 var(--font);
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        opacity: 1;
        white-space: nowrap;
        border: 2px solid #fff;
      }
      .pin.lbl:before {
        display: none;
      }
      .pin.lbl.on {
        transform: translate(-50%, -50%) scale(1.12);
      }
      .zon #tag {
        display: none !important;
      }
      .c.two {
        background: linear-gradient(135deg, var(--c) 50%, var(--c2) 50%);
      }
      .mseg {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .mseg button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font: 700 0.82rem var(--font);
        padding: 9px 14px;
        border-radius: 99px;
        cursor: pointer;
        transition: 0.2s;
      }
      .mseg button.on {
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        border: 0;
        color: #fff;
        transform: translateY(-1px);
      }
      .badge {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
        background: var(--acc2);
        color: #fff;
        font: 700 0.72rem/1 var(--font);
        padding: 7px 11px;
        border-radius: 99px;
      }
      .seg2 {
        grid-column: 1/-1;
        display: flex;
        gap: 6px;
        margin-bottom: 4px;
      }
      .seg2 button {
        flex: 1;
        border: 2px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 12px;
        padding: 10px 4px;
        font: 700 0.78rem var(--font);
        cursor: pointer;
      }
      .seg2 button.on {
        border-color: var(--acc);
        background: color-mix(in srgb, var(--acc) 12%, transparent);
      }
      .hintp {
        grid-column: 1/-1;
        margin: 0 0 6px;
        color: var(--mut);
        font-size: 0.78rem;
      }
      .stage.ld canvas {
        opacity: 0.4;
        transition: opacity 0.2s;
      }
      .opts {
        align-items: start;
      }

      /* ===== pastel redesign ===== */
      body {
        background:
          radial-gradient(700px 480px at 0% -5%, rgba(255, 190, 220, 0.55), transparent),
          radial-gradient(760px 520px at 105% 0%, rgba(190, 215, 255, 0.55), transparent),
          radial-gradient(700px 500px at 50% 110%, rgba(200, 245, 225, 0.5), transparent), var(--bg);
      }
      h1 {
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--fg);
      }
      h1 span {
        background: linear-gradient(90deg, #ff8fbc, #b79bff 55%, #7fc8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: none;
      }
      header p {
        color: var(--mut);
        font-weight: 500;
      }
      .stage {
        border-radius: 32px;
        border: 6px solid #fff;
        box-shadow:
          0 18px 44px rgba(175, 145, 215, 0.28),
          0 2px 0 rgba(255, 255, 255, 0.8) inset;
        background: #eceaf2;
      }

      .stage:after {
        background: radial-gradient(
          120% 90% at 50% 40%,
          transparent 62%,
          rgba(150, 120, 200, 0.14)
        );
      }
      /* floating buttons on the photo */
      .hold {
        background: rgba(255, 255, 255, 0.82);
        color: #6b5a93;
        border: 1.5px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 6px 16px rgba(160, 130, 200, 0.28);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font: 600 0.76rem/1 var(--font);
        padding: 10px 15px;
        border-radius: 99px;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          background 0.18s;
      }
      .hold:hover {
        transform: translateY(-2px);
        background: #fff;
        box-shadow: 0 10px 22px rgba(160, 130, 200, 0.36);
      }
      .hold:active {
        transform: scale(0.95);
      }
      .badge {
        background: linear-gradient(90deg, #ff9ec4, #b9a2ff);
        box-shadow: 0 6px 14px rgba(185, 162, 255, 0.5);
      }
      .pin {
        border-color: #fff;
        opacity: 0.9;
      }
      .pin.on {
        border-color: #ff8fbc;
      }
      .pin.on:before {
        border-color: #ff8fbc;
      }
      .tag {
        background: #fff;
        color: #6b5a93;
        box-shadow: 0 6px 16px rgba(160, 130, 200, 0.35);
      }
      /* model switch */
      .mseg {
        gap: 8px;
        margin-top: 12px;
      }
      .mseg button {
        background: #fff;
        border: 2px solid var(--line);
        color: var(--mut);
        padding: 10px 16px;
        border-radius: 99px;
        box-shadow: 0 4px 12px rgba(175, 145, 215, 0.15);
        transition: 0.2s;
      }
      .mseg button:hover {
        transform: translateY(-2px);
        border-color: #ffc6dd;
        color: var(--fg);
      }
      .mseg button.on {
        background: linear-gradient(135deg, #ffb3d1, #c4b0ff);
        border: 2px solid #fff;
        color: #fff;
        text-shadow: 0 1px 2px rgba(120, 90, 180, 0.35);
        box-shadow: 0 8px 18px rgba(190, 160, 255, 0.45);
        transform: none;
      }
      /* part tabs */
      .tabs {
        gap: 10px;
        padding: 18px 4px 12px;
      }
      .tab {
        background: #fff;
        border: 2px solid var(--line);
        color: var(--fg);
        padding: 9px 16px 9px 11px;
        border-radius: 99px;
        box-shadow: 0 4px 12px rgba(175, 145, 215, 0.14);
        font-weight: 600;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      .tab:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(175, 145, 215, 0.24);
      }
      .tab i {
        width: 18px;
        height: 18px;
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(120, 90, 160, 0.35);
      }
      .tab.on {
        background: linear-gradient(135deg, #ffc2dc, #d2c3ff);
        border-color: #fff;
        color: #4a3f66;
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(190, 160, 255, 0.5);
      }
      .tab.on i {
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
      }
      /* panel */
      .panel {
        border: 2px solid #fff;
        border-radius: 28px;
        padding: 18px 16px 14px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--sh);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .panel h2 {
        font-weight: 700;
        color: var(--fg);
      }
      .panel h2 small {
        color: #ff8fbc;
        background: #fff0f6;
        padding: 4px 10px;
        border-radius: 99px;
        font-weight: 600;
      }
      .opts {
        gap: 14px 6px;
      }
      .sw .c {
        width: 58px;
        height: 58px;
        border: 3px solid #fff;
        box-shadow:
          0 6px 14px rgba(150, 120, 190, 0.28),
          inset 0 -6px 10px rgba(0, 0, 0, 0.08),
          inset 0 5px 8px rgba(255, 255, 255, 0.45);
        transition:
          transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1),
          box-shadow 0.2s;
      }
      .sw:hover .c {
        transform: translateY(-3px) scale(1.06);
        box-shadow:
          0 12px 20px rgba(150, 120, 190, 0.36),
          inset 0 5px 8px rgba(255, 255, 255, 0.45);
      }

        return `<div class="excl">${sel === "talon" ? "Pon un personaje o tu nombre en el talón. Lo puedes mover y también cambiarle el color al talón." : "Rayas o personaje, uno u otro: si pones un personaje se quitan las rayas."}</div><div class="opts2" style="grid-column:1/-1">${EM.map((x) => `<button class="sw sk" data-e="${x}"><span class="c">${x}</span></button>`).join("")}</div><div class="srow" style="grid-column:1/-1"><button class="sw" data-a="minus"><span class="c sm">➖</span><em>Más chico</em></button><button class="sw" data-a="plus"><span class="c sm">➕</span><em>Más grande</em></button><button class="sw" data-a="del"><span class="c sm">🗑️</span><em>Quitar</em></button><label class="sw"><span class="c sm">📷<input type="file" accept="image/*" id="up"></span><em>Subir mi personaje</em></label></div>${sel === "talon" ? nameUI() : ""}`;
      };
      function renderUI() {
        $("#tabs").innerHTML = PARTS.filter((p) => !HID.includes(p.k)).map(
          (p) =>
            `<button class="tab ${p.k === sel ? "on" : ""}" data-k="${p.k}" style="--c:${getS(p.k).c}"><i></i>${p.t}</button>`,
        ).join("");
        const p = PART(sel);
        $("#ptitle").textContent = p.t;
        const isT = sel === "tiras";
        const isB = sel === "talon",
          pjm = (isT && deco === "pj") || (isB && decoT === "pj");
        $("#pcur").textContent = pjm ? "" : getS(sel).n;
        const bseg = isB
          ? `<div class="seg2 deco" style="grid-column:1/-1"><button data-decot="color" class="${decoT === "color" ? "on" : ""}">Color</button><button data-decot="pj" class="${decoT === "pj" ? "on" : ""}">Personaje</button></div>`
          : "";
        const dseg =
          bseg +
          (isT
            ? `<div class="seg2 deco" style="grid-column:1/-1"><button data-deco="rayas" class="${deco === "rayas" ? "on" : ""}">Rayas</button><button data-deco="pj" class="${deco === "pj" ? "on" : ""}">Personajes</button></div>`
            : "");
        const seg =
          isT && !pjm && PM.slices
            ? `<div class="seg2">${ST.map((s) => `<button data-st="${s[0]}" class="${TST[side] === s[0] ? "on" : ""}">${s[1]}</button>`).join("")}</div>`
            : "";
        $("#opts").style.display = pjm ? "block" : "";
        $("#opts").innerHTML = pjm
          ? dseg + stkUI()
          : dseg +
            (p.h ? `<p class="hintp">${p.h}</p>` : "") +
            seg +
            p.o
              .map(
                (o, i) =>
                  `<button class="sw ${getS(sel).n === o.n ? "on" : ""}" data-i="${i}" title="${o.n}"><span class="c ${o.g ? "g" : ""}${o.c2 ? " two" : ""}" style="--c:${o.c};--c2:${o.c2 || o.c};--s:${o.s || "#fff"}"></span><em>${o.n}</em></button>`,
              )
              .join("");
        $("#sum").innerHTML = sumHTML();
        document.querySelectorAll(".pin").forEach((e) => {
          e.classList.toggle("on", e.dataset.k === sel);
          e.style.setProperty("--c", getS(e.dataset.k).c);
        });
        const tg = $("#tag"),
          pp = pinPos[sel];
        if (pp) {
          tg.style.display = "";
          tg.style.left = fx_(pp[0]) + "%";
          tg.style.top = pp[1] + "%";
          tg.textContent = p.t;
        }
        renderWA();
      }
      const choose = (k) => {
        sel = k;
        if (k === "tiras") {
          if (stk.some((z) => z.zone !== "talon")) deco = "pj";
          else if (TST[side] !== "none") deco = "rayas";
        }
        renderUI();
        document
          .getElementById("tabs")
          .querySelector(".tab.on")
          ?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      };
      function drawStk() {
        const c = $("#stk"),
          w = $("#stage").clientWidth;
        c.innerHTML = "";
        stk.forEach((z, i) => {
          if (z.side !== side) return;
          const d = document.createElement("div");
          d.className = "stk" + (i === stkSel ? " sel" : "");
          d.style.cssText = `left:${fx_(z.x)}%;top:${z.y}%;font-size:${(z.s / 100) * w}px;width:${z.img ? (z.s / 100) * w + "px" : "auto"}`;
          d.innerHTML = z.img
            ? `<img src="${z.img}" draggable="false">`
            : z.txt
              ? `<span class="ntxt" style="color:${z.c}">${z.txt.replace(/[<>&]/g, "")}</span>`
              : z.e;
          d.onpointerdown = (ev) => {
            ev.preventDefault();
            stkSel = i;
            d.setPointerCapture(ev.pointerId);
            const r = $("#stage").getBoundingClientRect();
            d.onpointermove = (m) => {
              z.x = fx_(Math.max(0, Math.min(100, ((m.clientX - r.left) / r.width) * 100)));
              z.y = Math.max(0, Math.min(100, ((m.clientY - r.top) / r.height) * 100));
              d.style.left = fx_(z.x) + "%";
              d.style.top = z.y + "%";
            };
            d.onpointerup = () => {
              d.onpointermove = null;
              drawStk();
            };
          };
          c.appendChild(d);
        });
        renderWA();
      }
      function addStk(o) {
        const zt = sel === "talon";
        if (zt && pinPos.talon) {
          o = { ...o, x: pinPos.talon[0], y: pinPos.talon[1], s: o.s ?? 11, zone: "talon" };
        }
        if (!zt && clearTiras()) {
          toast("Quité las rayas: el tenis lleva rayas o personaje, no los dos");
          renderUI();
        }
        stk.push({ ...o, side, x: fx_(o.x ?? PM.stk[0]), y: o.y ?? PM.stk[1], s: o.s ?? 15 });
        stkSel = stk.length - 1;
        drawStk();
      }
      addEventListener("resize", drawStk);
      document.addEventListener("change", (e) => {
        if (e.target.id === "up" && e.target.files[0]) {
          const f = new FileReader();
          f.onload = () => addStk({ img: f.result });
          f.readAsDataURL(e.target.files[0]);
        }
      });

      function colorFx(o) {
        const st = document.getElementById("stage");
        if (!st) return;
        const pin = document.querySelector("#pins .on, #pins .pin.on, #pins [data-k='" + sel + "']");
        const r = st.getBoundingClientRect();
        let x = r.width * 0.5, y = r.height * 0.5;
        if (pin) {
          const p = pin.getBoundingClientRect();
          x = p.left - r.left + p.width / 2;
          y = p.top - r.top + p.height / 2;
        }
        const rp = document.createElement("div");
        rp.className = "ripple";
        rp.style.cssText = `left:${x}px;top:${y}px;--rc:${(o && o.c) || "#ff3d81"}`;
        st.appendChild(rp);
        setTimeout(() => rp.remove(), 950);
      }
      function burst(x, y) {
        const cs = ["#ff3d81", "#ffd60a", "#2563eb", "#2a9d4b", "#fb8500", "#7c5cff"];
        for (let i = 0; i < 18; i++) {
          const e = document.createElement("i");
          e.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:9px;height:9px;border-radius:${i % 2 ? "50%" : "2px"};background:${cs[i % 6]};pointer-events:none;z-index:99`;
          document.body.appendChild(e);
          const a = Math.random() * 6.28,
            d = 40 + Math.random() * 80;
          e.animate(
            [
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              {
                transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 34}px) rotate(${Math.random() * 360}deg) scale(.4)`,
                opacity: 0,
              },
            ],
            { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.8,.3,1)" },
          ).onfinish = () => e.remove();
        }
      }
      $("#tabs").onclick = (e) => {
        const b = e.target.closest(".tab");
        if (b) choose(b.dataset.k);
      };
      $("#opts").onclick = (e) => {
        const tcb = e.target.closest("[data-tc]");
        if (tcb) {
          nameC = tcb.dataset.tc;
          const z = stk[stkSel];
          if (z && z.txt) {
            z.c = nameC;
            drawStk();
          }
          document
            .querySelectorAll(".nc")
            .forEach((x) => x.classList.toggle("on", x.dataset.tc === nameC));
          return;
        }
        const dt = e.target.closest("[data-decot]");
        if (dt) {
          decoT = dt.dataset.decot;
          renderUI();
          return;
        }
        const dc = e.target.closest("[data-deco]");
        if (dc) {
          deco = dc.dataset.deco;
          renderUI();
          return;
        }
        const st = e.target.closest("[data-st]");
        if (st) {
          if (st.dataset.st !== "none" && clearStk())
            toast("Quité los personajes: el tenis lleva rayas o personaje, no los dos");
          TST[side] = st.dataset.st;
          applySlices(true);
          renderUI();
          return;
        }
        const b = e.target.closest(".sw");
        if (!b) return;
        if (b.dataset.e) {
          addStk({ e: b.dataset.e });
          return;
        }
        if (b.dataset.a === "name") {
          const v = ($("#nm").value || "").trim();
          if (v) addStk({ txt: v, c: nameC, s: 9 });
          return;
        }
        if (b.dataset.a) {
          const z = stk[stkSel];
          if (b.dataset.a === "del" && z) {
            stk.splice(stkSel, 1);
            stkSel = stk.length - 1;
          } else if (z) z.s = Math.max(8, Math.min(40, z.s + (b.dataset.a === "plus" ? 3 : -3)));
          drawStk();
          return;
        }
        if (b.dataset.i === undefined) return;
        burst(e.clientX, e.clientY);
        setPart(sel, PART(sel).o[b.dataset.i]);
        colorFx(PART(sel).o[b.dataset.i]);
        renderUI();
      };
      function resetAll() {
        stk = [];
        stkSel = -1;
        deco = "rayas";
        decoT = "color";
        drawStk();
        applyBase(BASES.find((b) => b.n === "Blanco"));
        baseSel = false;
        renderBases();
      }
      function applyBase(o, an = true) {
        baseC = o;
        baseSel = true;
        clearStk();
        CP.forEach((p) => {
          const c = partColor(o, p.k);
          if (p.k === "tiras") TS.out = TS.in = c;
          else state[p.k] = c;
        });
        TST.out = "none";
        CP.forEach((p) => applyPart(p.k, an));
        renderUI();
        renderBases();
      }
      const _rUI = renderUI;
      renderUI = function () {
        _rUI();
        renderBases();
      };
      function renderBases() {
        const el = $("#bases");
        if (!el) return;
        el.innerHTML = BASES.map(
          (b, i) =>
            `<button class="bs ${baseSel && b === baseC ? "on" : ""}" data-b="${i}" title="${b.n}" style="--c:${b.c}"><i></i><span>${b.n}</span></button>`,
        ).join("");
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest && e.target.closest(".bs");
        if (!b) return;
        burst(e.clientX, e.clientY);
        applyBase(BASES[+b.dataset.b]);
      });
      $("#rst").onclick = resetAll;
      $("#rnd").onclick = () => {
        CP.forEach((p) => {
          if (HID.includes(p.k)) return;
          const o = p.o[(Math.random() * p.o.length) | 0];
          if (p.k === "tiras") {
            TS[side] = o;
            if (PM.slices) {
              TST[side] = ["ancha", "dos", "tres"][(Math.random() * 3) | 0];
              clearStk();
            }
          } else state[p.k] = o;
        });
        CP.forEach((p) => applyPart(p.k));
        renderUI();
      };
      const hold = $("#hold"),
        onO = (v) => {
          showOrig = v;
          if (v) ctx.putImageData(orig, 0, 0);
          else render();
        };
      hold.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        onO(true);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
        hold.addEventListener(ev, () => onO(false)),
      );
      cv.addEventListener("click", (e) => {
        if (!owner) return;
        const r = cv.getBoundingClientRect(),
          x = Math.floor(
            ((side === "in" ? r.right - e.clientX : e.clientX - r.left) / r.width) * W,
          ),
          y = Math.floor(((e.clientY - r.top) / r.height) * H);
        let o = owner[y * W + x];
        if (o > 0) {
          let k = PARTS[o - 1].k;
          if (k === "costado" && PM.slices && ACT[TST[side]].includes(sliceId[y * W + x]))
            k = "tiras";
          choose(k);
        }
      });
      function placePins() {
        document.querySelectorAll(".pin").forEach((e) => {
          const o = showZones ? PM.dz[e.dataset.k] || [0, 0] : [0, 0];
          e.style.left = fx_(pinPos[e.dataset.k][0] + o[0]) + "%";
          e.style.top = pinPos[e.dataset.k][1] + o[1] + "%";
        });
      }
      $("#zbtn").onclick = () => {
        showZones = !showZones;
        $("#zbtn").textContent = showZones ? "Ver colores" : "Ver zonas";
        $("#stage").classList.toggle("zon", showZones);
        document.querySelectorAll(".pin").forEach((e) => {
          const p = PART(e.dataset.k);
          e.classList.toggle("lbl", showZones);
          e.textContent = showZones ? p.t : "";
          e.style.background = showZones ? ZC[e.dataset.k] : "";
        });
        placePins();
      };
      $("#spin").onclick = () => {
        if (busy) return;
        const r = $("#rot");
        r.style.transform = "rotateY(90deg)";
        setTimeout(() => {
          side = side === "out" ? "in" : "out";
          $("#cw").classList.toggle("fl", side === "in");
          $("#spin").textContent = side === "out" ? "Ver lado de adentro" : "Ver lado de afuera";
          $("#sidebadge").style.display = side === "in" ? "" : "none";
          PM.slices ? applySlices(true) : applyPart("tiras", true);
          placePins();
          drawStk();
          renderUI();
          r.style.transition = "transform .32s ease-out";
          r.style.transform = "rotateY(0)";
          setTimeout(() => (r.style.transition = ""), 340);
        }, 320);
      };
      $("#mseg").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b || busy || b.dataset.m === MK) return;
        loadModel(b.dataset.m);
      };
      async function loadModel(name) {
        busy = true;
        MK = name;
        PM = META[name];
        SEL = new Set(PM.sel);
        const mm = MODELS[name];
        $("#stage").classList.add("ld");
        document
          .querySelectorAll("#mseg button")
          .forEach((b) => b.classList.toggle("on", b.dataset.m === name));
        const bi = await load(mm.base);
        W = bi.width;
        H = bi.height;
        cv.width = fx.width = W;
        cv.height = fx.height = H;
        ctx.drawImage(bi, 0, 0);
        orig = ctx.getImageData(0, 0, W, H);
        out = ctx.getImageData(0, 0, W, H);
        acc = Float32Array.from(orig.data);
        Lf = new Float32Array(W * H);
        for (let i = 0; i < W * H; i++)
          Lf[i] =
            0.299 * orig.data[i * 4] + 0.587 * orig.data[i * 4 + 1] + 0.114 * orig.data[i * 4 + 2];
        Lb = blurL(Lf);
        data = {};
        tw = {};
        cur = {};
        state = {};
        stk = [];
        stkSel = -1;
        side = "out";
        showZones = false;
        showOrig = false;
        sel = "suela";
        TST.out = "none";
        $("#cw").classList.remove("fl");
        $("#spin").textContent = "Ver lado de adentro";
        $("#sidebadge").style.display = "none";
        $("#zbtn").textContent = "Ver zonas";
        $("#stage").classList.remove("zon");
        $("#rot").style.transform = "";
        PARTS = buildParts(name);
        CP = PARTS.filter((p) => !p.stk);
        for (const k in mm.masks) prep(k, await load(mm.masks[k]));
        const sA = new Float32Array(W * H);
        for (const k in data) {
          if (SEL.has(k)) continue;
          const d = data[k];
          d.idx.forEach((i, j) => (sA[i] += d.a[j]));
        }
        owner = new Uint8Array(W * H);
        sliceId = new Uint8Array(W * H);
        const best = new Float32Array(W * H);
        for (const k in data) {
          const d = data[k],
            sl = /^cs\d+$/.test(k),
            isAg = k === "ag1" || k === "ag2",
            pi = PARTS.findIndex((p) => p.k === k) + 1;
          d.idx.forEach((i, j) => {
            if (!SEL.has(k)) d.a[j] /= Math.max(1, sA[i]);
            if (sl && d.a[j] > 0.5) sliceId[i] = +k.slice(2);
            if (isAg || sl || HID.includes(k)) return;
            if (d.a[j] > best[i]) {
              best[i] = d.a[j];
              owner[i] = pi;
            }
          });
        }
        for (const k in data) if (!SEL.has(k)) cur[k] = hex("#ffffff");
        CP.forEach((p) => {
          const o = partColor(baseC, p.k);
          if (p.k === "tiras") TS.out = TS.in = o;
          else state[p.k] = o;
        });
        CP.forEach((p) => applyPart(p.k, false));
        for (const k in data) paint(k);
        render();
        // pins
        $("#pins").innerHTML = "";
        pinPos = {};
        CP.forEach((p) => {
          if (HID.includes(p.k)) return;
          const d = data[p.pm || p.k];
          if (!d) return;
          let sx = 0,
            sy = 0,
            n = 0;
          d.idx.forEach((i, j) => {
            if (d.a[j] > 0.9) {
              sx += i % W;
              sy += (i / W) | 0;
              n++;
            }
          });
          if (!n) return;
          sx /= n;
          sy /= n;
          let bd = 1e9,
            bx = sx,
            by = sy;
          d.idx.forEach((i, j) => {
            if (d.a[j] > 0.95) {
              const x = i % W,
                y = (i / W) | 0,
                dd = (x - sx) ** 2 + (y - sy) ** 2;
              if (dd < bd) {
                bd = dd;
                bx = x;
                by = y;
              }
            }
          });
          pinPos[p.k] = [(bx / W) * 100, (by / H) * 100];
          const e = document.createElement("button");
          e.className = "pin";
          e.dataset.k = p.k;
          e.title = p.t;
          e.setAttribute("aria-label", p.t);
          e.onclick = (ev) => {
            ev.stopPropagation();
            choose(p.k);
          };
          $("#pins").appendChild(e);
        });
        placePins();
        // zones overlay
        zonesImg = document.createElement("canvas");
        zonesImg.width = W;
        zonesImg.height = H;
        {
          const zx = zonesImg.getContext("2d"),
            zd = zx.createImageData(W, H);
          CP.filter((p) => !HID.includes(p.k)).forEach((p) =>
            (p.zm || [p.k]).forEach((mk) => {
              const d = data[mk];
              if (!d) return;
              const c = hex(ZC[p.k]);
              d.idx.forEach((i, j) => {
                const a = d.a[j] * 165;
                if (a > 20) {
                  zd.data[i * 4] = c[0];
                  zd.data[i * 4 + 1] = c[1];
                  zd.data[i * 4 + 2] = c[2];
                  zd.data[i * 4 + 3] = a;
                }
              });
            }),
          );
          zx.putImageData(zd, 0, 0);
        }
        renderUI();
        drawStk();
        $("#stage").classList.remove("ld");
        busy = false;
        if (!started) {
          started = true;
          requestAnimationFrame(frame);
        }
      }
      loadModel("agujetas");
    </script>
  </body>
</html>
